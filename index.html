<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
window.__ok=true;
const $=id=>document.getElementById(id);
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const PI=Math.PI,TAU=PI*2,rand=Math.random,rr=(a,b)=>a+rand()*(b-a),lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
const MOBILE=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<700;
const DENS=MOBILE?.5:1;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function randDir(){const u=rand()*2-1,a=rand()*TAU,s=Math.sqrt(1-u*u);return V(s*Math.cos(a),s*Math.sin(a),u)}
const pick=a=>a[(rand()*a.length)|0];

/* ===== renderer ===== */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:!MOBILE,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,MOBILE?1.5:2));renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020406);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,2500);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=7;controls.maxDistance=520;controls.enablePan=false;controls.rotateSpeed=.7;
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth*(MOBILE?.5:1),innerHeight*(MOBILE?.5:1)),.6,.55,.14);
composer.addPass(bloom);composer.addPass(new OutputPass());

/* ===== shared uniforms ===== */
const U={uScanC:{value:V()},uScanR:{value:1},uScanT:{value:-1},uTime:{value:0},uBass:{value:0},uPx:{value:1},
  uGlow:{value:new THREE.Color('#5cf2d6')},uVein:{value:new THREE.Color('#9a6bff')},uHot:{value:new THREE.Color('#f2fffb')},uUnit:{value:new THREE.Color('#e8f4ff')}};
const FADE=`float fade(float d){return exp(-max(d-25.,0.)*.0055);}`;
const NEAR=`float nearF(vec3 w){return smoothstep(34.,13.,distance(cameraPosition,w));}`;
const add=o=>new THREE.ShaderMaterial(Object.assign({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending},o));
const softFrag=`varying vec3 vC;varying float vA;void main(){vec2 c=gl_PointCoord-.5;float d=length(c);if(d>.5)discard;float f=smoothstep(.5,0.,d);f*=f;gl_FragColor=vec4(vC*vA*f,1.);}`;
const ptMat=(col,max=64)=>new THREE.ShaderMaterial({uniforms:{uPx:U.uPx,uCol:col},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:`uniform float uPx;uniform vec3 uCol;attribute float al;attribute float sz;varying vec3 vC;varying float vA;
void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;vA=al;gl_PointSize=clamp(sz*uPx*120./max(-mv.z,1.),1.,${max}.);vC=uCol;}`,fragmentShader:softFrag});
function dynPts(n,col,max){const P=new Float32Array(n*3),A=new Float32Array(n),S=new Float32Array(n),g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(P,3).setUsage(THREE.DynamicDrawUsage));g.setAttribute('al',new THREE.BufferAttribute(A,1).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('sz',new THREE.BufferAttribute(S,1).setUsage(THREE.DynamicDrawUsage));const o=new THREE.Points(g,ptMat(col,max));o.frustumCulled=false;scene.add(o);
  return{P,A,S,g,up(){g.attributes.position.needsUpdate=true;g.attributes.al.needsUpdate=true;g.attributes.sz.needsUpdate=true}}}

/* ===== simulated pathology data (modelled on the SEA-AD cell taxonomy) ===== */
const SECTORS=[{n:'ENTORHINAL CTX',x:.43,y:.74},{n:'HIPPOCAMPUS CA1',x:.52,y:.62},{n:'HIPPOCAMPUS CA3',x:.58,y:.64},{n:'MID TEMPORAL GYRUS',x:.38,y:.62},
  {n:'PRECUNEUS',x:.7,y:.28},{n:'POST. CINGULATE',x:.6,y:.4},{n:'PREFRONTAL CTX',x:.17,y:.36},{n:'ANGULAR GYRUS',x:.78,y:.44}];
const CELLS=['L2/3 IT','L4 IT','L5 IT','L6 IT','L5 ET','Sst','Pvalb','Vip','Lamp5','Sncg','Astrocyte','Microglia-PVM','Oligodendrocyte','OPC'];
const MARKERS=['Aβ plaque','pTau tangle','synapse loss','microglial activation'];

/* ===== clusters ===== */
const CP=[],CN=[],CB=[],CS=[],CZ=[];const LOBES=[];const SITES=[];
function noise3(d,o){return Math.sin(d.x*1.9+o.x)*Math.sin(d.y*2.3+o.y)*Math.sin(d.z*1.7+o.z)+.5*Math.sin(d.x*4.1+o.z)*Math.sin(d.y*3.7+o.x)}
function makeLobe(c,R,main,group){
  const n=Math.round(R*R*(main?60:32)*DENS),start=CP.length/3,surf=[],o=V(rand()*9,rand()*9,rand()*9),bf=main?1:.42;
  const nuc=[0,1,2].map(()=>randDir().multiplyScalar(R*rr(.15,.5)));
  for(let i=0;i<n;i++){const d=randDir(),rad=R*(1+.24*noise3(d,o));let p,b,s;const q=rand();
    if(q<.68){p=d.clone().multiplyScalar(rad*rr(.97,1.03));b=.15;s=rr(.8,1.4);surf.push(start+i)}
    else if(q<.9){p=d.clone().multiplyScalar(rad*Math.cbrt(rand())*.88);b=.06;s=rr(.6,1.1)}
    else{const k=nuc[i%3];p=k.clone().add(randDir().multiplyScalar(rr(0,.35)*R*.4));b=.32;s=rr(1.3,2.2)}
    p.add(c);CP.push(p.x,p.y,p.z);const nn=p.clone().sub(c).normalize();CN.push(nn.x,nn.y,nn.z);CB.push(b*bf*1.7);CS.push(rand());CZ.push(s*(main?1:1.3))}
  const L={c:c.clone(),R,start,count:n,surf,main,group,visited:false,repaired:false,id:'CL-'+String(1000+Math.floor(rand()*8999)),
    cell:pick(CELLS),marker:pick(MARKERS),sector:SECTORS[(group??0)%SECTORS.length],sites:[],timeOn:0,repairT:0,scanT:0};
  if(main){const k=2+((rand()*4)|0);for(let j=0;j<k;j++){const idx=surf[(rand()*surf.length)|0];const s={p:V(CP[idx*3],CP[idx*3+1],CP[idx*3+2]),dmg:rr(.5,1),d0:0,lobe:L,marker:rand()<.6?L.marker:pick(MARKERS),t0:-1,i:SITES.length};s.d0=s.dmg;L.sites.push(s);SITES.push(s)}}
  LOBES.push(L);return L}
const SEQ=[];
{const G=MOBILE?26:36,RL=92;
  for(let g=0;g<G;g++){const a=g/G*TAU;
    const base=V(Math.cos(a)*RL*(1+.22*Math.sin(3*a)),Math.sin(2*a)*26+rr(-6,6),Math.sin(a)*RL*(1+.22*Math.cos(2*a))).add(randDir().multiplyScalar(rr(0,5)));
    const tan=V(-Math.sin(a),0,Math.cos(a));const k=rand()<.4?1:rand()<.6?2:3;let prev=null;
    for(let j=0;j<k;j++){const R=rr(2.6,4.4);let c;
      if(!prev)c=base;else{const d=randDir();d.addScaledVector(tan,-d.dot(tan)*.7).normalize();c=prev.c.clone().addScaledVector(d,(prev.R+R)*.9)}
      prev=makeLobe(c,R,true,g);SEQ.push(prev)}}}
const MAINN=LOBES.length;
for(let i=0,tries=0;i<(MOBILE?28:46)&&tries<3000;tries++){const c=randDir().multiplyScalar(rr(40,240));c.y*=.6;
  if(LOBES.slice(0,MAINN).some(L=>L.c.distanceTo(c)<26))continue;makeLobe(c,rr(2,6.5),false,null);i++}
const W0=SEQ.reduce((a,L)=>a.add(L.c),V()).multiplyScalar(1/SEQ.length);
const NP=CP.length/3,HEAT=new Float32Array(NP),LIT=new Float32Array(NP);
const cg=new THREE.BufferGeometry();
cg.setAttribute('position',new THREE.Float32BufferAttribute(CP,3));cg.setAttribute('nrm',new THREE.Float32BufferAttribute(CN,3));
cg.setAttribute('base',new THREE.Float32BufferAttribute(CB,1));cg.setAttribute('seed',new THREE.Float32BufferAttribute(CS,1));cg.setAttribute('sz',new THREE.Float32BufferAttribute(CZ,1));
const heatA=new THREE.BufferAttribute(HEAT,1).setUsage(THREE.DynamicDrawUsage),litA=new THREE.BufferAttribute(LIT,1).setUsage(THREE.DynamicDrawUsage);
cg.setAttribute('heat',heatA);cg.setAttribute('lit',litA);
const clusters=new THREE.Points(cg,add({vertexShader:`uniform float uTime;uniform float uBass;uniform float uPx;uniform vec3 uGlow;uniform vec3 uHot;uniform vec3 uScanC;uniform float uScanR;uniform float uScanT;${FADE}
attribute vec3 nrm;attribute float base;attribute float seed;attribute float sz;attribute float heat;attribute float lit;varying vec3 vC;varying float vA;
void main(){vec3 p=position+nrm*(sin(uTime*1.3+seed*6.28)*.07+uBass*.18*base*2.4);
vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;
float sc=0.;if(uScanT>=0.){vec3 q=position-uScanC;float band=exp(-pow((q.y/uScanR-(1.-uScanT*2.))*7.,2.));sc=band*step(length(q),uScanR*1.35)*.28;}
float br=base*(.75+.25*sin(uTime*.8+seed*31.))+lit+heat*.55+sc;
vA=br*fade(-mv.z);gl_PointSize=clamp(sz*(1.+heat*.7)*uPx*120./max(-mv.z,1.),1.,48.);
vC=mix(uGlow,uHot,clamp(heat*.45+lit*.4+sc*1.5,0.,1.));}`,fragmentShader:softFrag}));
clusters.frustumCulled=false;scene.add(clusters);

/* ===== close-up detail: etched circuitry + data packets, only visible near the camera ===== */
{const EP=[],ES=[],PA=[],PB=[],PO=[],PSd=[];
 for(const L of SEQ){for(let t=0;t<(MOBILE?6:11);t++){let d=randDir();const ax0=randDir();let prev=L.c.clone().addScaledVector(d,L.R*1.04);const sd=rand();
   const steps=5+((rand()*7)|0);for(let s=0;s<steps;s++){const ax=(s%2?ax0:V(0,1,0)).clone().cross(d).normalize();if(ax.lengthSq()<.01)continue;
     d.applyAxisAngle(ax,rr(.14,.32)*(rand()<.5?-1:1));const p=L.c.clone().addScaledVector(d,L.R*1.04);EP.push(prev.x,prev.y,prev.z,p.x,p.y,p.z);ES.push(sd,sd);
     if(rand()<.35){PA.push(prev.x,prev.y,prev.z);PB.push(p.x,p.y,p.z);PO.push(rand());PSd.push(rr(.4,1.4))}prev=p}}}
 const eg=new THREE.BufferGeometry();eg.setAttribute('position',new THREE.Float32BufferAttribute(EP,3));eg.setAttribute('seed',new THREE.Float32BufferAttribute(ES,1));
 const et=new THREE.LineSegments(eg,add({vertexShader:`uniform float uTime;uniform vec3 uGlow;${NEAR}attribute float seed;varying vec3 vC;varying float vA;
void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);vA=nearF(position)*(.14+.1*sin(uTime*2.+seed*30.));vC=mix(uGlow,vec3(1.),.35);}`,
  fragmentShader:`varying vec3 vC;varying float vA;void main(){gl_FragColor=vec4(vC*vA,1.);}`}));et.frustumCulled=false;scene.add(et);
 const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(PA,3));pg.setAttribute('pb',new THREE.Float32BufferAttribute(PB,3));
 pg.setAttribute('off',new THREE.Float32BufferAttribute(PO,1));pg.setAttribute('spd',new THREE.Float32BufferAttribute(PSd,1));
 const pk=new THREE.Points(pg,add({vertexShader:`uniform float uTime;uniform float uPx;uniform float uBass;${NEAR}attribute vec3 pb;attribute float off;attribute float spd;varying vec3 vC;varying float vA;
void main(){vec3 p=mix(position,pb,fract(uTime*spd*(1.+uBass)+off));vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;
vA=nearF(p)*.9;gl_PointSize=clamp(uPx*70./max(-mv.z,1.),1.,10.);vC=vec3(.85,1.,.95);}`,fragmentShader:softFrag}));pk.frustumCulled=false;scene.add(pk)}

/* ===== damage sites (red) → repaired (teal) ===== */
const siteA=new Float32Array(SITES.length);
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(SITES.flatMap(s=>[s.p.x,s.p.y,s.p.z]),3));
sg.setAttribute('dmg',new THREE.BufferAttribute(siteA,1).setUsage(THREE.DynamicDrawUsage));sg.setAttribute('seed',new THREE.Float32BufferAttribute(SITES.map(()=>rand()),1));
const sitePts=new THREE.Points(sg,add({vertexShader:`uniform float uTime;uniform float uPx;uniform vec3 uGlow;${FADE}attribute float dmg;attribute float seed;varying vec3 vC;varying float vA;
void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;float on=step(.01,dmg);
vA=(on*(.5+.35*sin(uTime*4.+seed*20.))*(.4+.6*dmg)+(1.-on)*.35)*fade(-mv.z);gl_PointSize=clamp((1.+dmg*1.4)*uPx*130./max(-mv.z,1.),1.5,30.);
vC=mix(uGlow,vec3(1.,.28,.22),on);}`,fragmentShader:softFrag}));sitePts.frustumCulled=false;scene.add(sitePts);
function siteSync(){for(const s of SITES)siteA[s.i]=s.dmg;sg.attributes.dmg.needsUpdate=true}siteSync();

/* ===== tissue: veins between clusters, mycelial growth, subdivided cell shells ===== */
const VP=[],VU=[],VPH=[],VW=[],MP=[],MS=[],MA=[],MPH=[];
function pushSeg(p,q,u0,u1,ph,w){VP.push(p.x,p.y,p.z,q.x,q.y,q.z);VU.push(u0,u1);VPH.push(ph,ph);VW.push(w,w)}
function vein(a,b,w){const len=a.distanceTo(b);if(len<.5)return;const o1=randDir().multiplyScalar(len*rr(.1,.28)),o2=randDir().multiplyScalar(len*rr(.04,.12)),ph=rand()*TAU;
  const n=Math.max(10,Math.min(70,Math.round(len/1.1)));const pts=[];
  for(let i=0;i<=n;i++){const u=i/n;pts.push(a.clone().lerp(b,u).addScaledVector(o1,Math.sin(PI*u)).addScaledVector(o2,Math.sin(TAU*u*1.5)))}
  for(const off of[V(),randDir().multiplyScalar(rr(.12,.3))])for(let i=1;i<=n;i++){const k=off.clone().multiplyScalar(Math.sin(PI*(i/n)));
    pushSeg(pts[i-1].clone().add(k),pts[i].clone().add(k),(i-1)/n*len*.08,i/n*len*.08,ph,w)}
  for(let i=1;i<n;i+=3){const p=pts[i];MP.push(p.x,p.y,p.z);MS.push(rr(5,12));MA.push(w*rr(.012,.03));MPH.push(ph+i*.3)}}
const onSurf=(L,toward)=>L.c.clone().addScaledVector(toward.clone().sub(L.c).normalize(),L.R*.95);
for(let i=0;i<SEQ.length;i++){const A=SEQ[i],B=SEQ[(i+1)%SEQ.length];for(let s=0;s<2;s++)vein(onSurf(A,B.c),onSurf(B,A.c),.8)}
for(let i=0;i<LOBES.length;i++){const L=LOBES[i];const near=LOBES.map((M,j)=>[M.c.distanceTo(L.c),j]).filter(x=>x[1]!==i).sort((a,b)=>a[0]-b[0]).slice(0,L.main?3:2);
  for(const[d,j]of near)if(rand()<.55&&d<90)vein(onSurf(L,LOBES[j].c),onSurf(LOBES[j],L.c),L.main&&LOBES[j].main?.55:.32)}
// mycelium: branching hyphae grown from roots through the whole space
{const roots=MOBILE?14:28;let budget=MOBILE?2600:6000;
 for(let r=0;r<roots&&budget>0;r++){const p0=randDir().multiplyScalar(rr(20,240));p0.y*=.6;const ph=rand()*TAU;const st=[{p:p0,d:randDir(),depth:0,n:(18+rand()*14)|0,u:0}];
  while(st.length&&budget>0){const b=st.pop();let p=b.p.clone(),d=b.d.clone(),u=b.u;

const PAT={hr:66,last:0,ecg:new Float32Array(220),ei:0,acc:0,spo2:97.4};
const gyri=Array.from({length:14},()=>({x:rr(.12,.85),y:rr(.15,.6),r:rr(8,20),a:rr(0,TAU)}));
const gw=(t,c,s)=>Math.exp(-(((t-c)/s)**2));function ecgShape(t){return .12*gw(t,.08,.025)-.15*gw(t,.17,.01)+gw(t,.2,.012)-.25*gw(t,.23,.012)+.25*gw(t,.42,.045)}
function patTick(now,dt,ev){const tot=totals();PAT.tot=tot;const hrT=64+SP.pace*20+tot.burden*4;PAT.hr+=(hrT-PAT.hr)*dt*.5;
  if((ev&&ev.kick&&now-PAT.last>.42)||now-PAT.last>60/PAT.hr)PAT.last=now;
  PAT.acc+=dt*60;while(PAT.acc>=1){PAT.acc--;PAT.ecg[PAT.ei]=ecgShape(now-PAT.last)+(rand()-.5)*.02;PAT.ei=(PAT.ei+1)%PAT.ecg.length}
  PAT.spo2+=((97.8-tot.burden*1.2)-PAT.spo2)*dt*.2}
function drawPat(now){const x=PP.ctx,w=PP.w,h=PP.h;x.clearRect(0,0,w,h);const tot=PAT.tot,L=SP.jump?SEQ[SP.jump.next]:lobeOf();
  T(x,'PT-0417 · F · 78Y · AD STAGE III (SIM)',12,16,.55,8.5);
  const bx=14,by=24,bw=w-28,bh=112;x.save();x.translate(bx,by);
  x.strokeStyle=C1+'.55)';x.lineWidth=1.2;x.beginPath();x.moveTo(.06*bw,.55*bh);
  x.bezierCurveTo(0,.2*bh,.25*bw,.02*bh,.5*bw,.06*bh);x.bezierCurveTo(.78*bw,.02*bh,.98*bw,.2*bh,.94*bw,.5*bh);
  x.bezierCurveTo(.92*bw,.68*bh,.8*bw,.72*bh,.7*bw,.7*bh);x.bezierCurveTo(.6*bw,.86*bh,.4*bw,.86*bh,.3*bw,.72*bh);x.bezierCurveTo(.18*bw,.74*bh,.08*bw,.7*bh,.06*bw,.55*bh);x.stroke();
  x.beginPath();x.ellipse(.8*bw,.8*bh,.12*bw,.1*bh,-.2,0,TAU);x.stroke();x.beginPath();x.moveTo(.64*bw,.8*bh);x.lineTo(.66*bw,.98*bh);x.stroke();
  x.strokeStyle=C1+'.14)';x.lineWidth=1;for(const g of gyri){x.beginPath();x.arc(g.x*bw,g.y*bh,g.r,g.a,g.a+1.6);x.stroke()}
  for(const S of SECTORS){const ls=SEQ.filter(q=>q.sector===S);let d=0,d0=0;for(const q of ls)for(const s of q.sites){d+=s.dmg;d0+=s.d0}const f=d0?d/d0:0;
    x.fillStyle=(f>.05?C2:C1)+(.25+.5*f)+')';x.beginPath();x.arc(S.x*bw,S.y*bh,3+f*3,0,TAU);x.fill()}
  const S=L.sector,pu=.5+.5*Math.sin(now*5);x.strokeStyle=C3+(.5+pu*.4)+')';x.beginPath();x.arc(S.x*bw,S.y*bh,8+pu*4,0,TAU);x.stroke();
  const lx=S.x>.5?S.x*bw-34:S.x*bw+34;Ln(x,S.x*bw,S.y*bh,lx,bh+2,.4,C3);T(x,S.n,lx,bh+12,.85,8,C3,S.x>.5?'right':'left');x.restore();
  let y=by+bh+34;
  T(x,'HR',12,y,.42,8);T(x,PAT.hr.toFixed(0),12,y+18,.9,18);T(x,'bpm',44,y+18,.4,8);
  x.strokeStyle='rgba(120,255,160,.85)';x.lineWidth=1.2;x.beginPath();const ex=72,ew=w-84;
  for(let i=0;i<PAT.ecg.length;i++){const v=PAT.ecg[(PAT.ei+i)%PAT.ecg.length],X=ex+i/PAT.ecg.length*ew,Y=y+12-v*16;i?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke();x.lineWidth=1;
  y+=34;const cell=(k,v,X)=>{T(x,k,X,y,.42,8);T(x,v,X,y+13,.85,11)};
  cell('SpO₂',PAT.spo2.toFixed(1)+'%',12);cell('BP',`${(116+SP.pace*8)|0}/${(74+SP.pace*4)|0}`,82);cell('TEMP','36.9°',152);cell('RESP',String((14+SP.pace*3)|0),214);
  y+=30;T(x,'EEG',12,y,.42,8);const bE=['δ','θ','α','β','γ'],rg=[[1,2],[3,5],[6,9],[10,40],[41,120]];
  for(let k=0;k<5;k++){let v=0;if(fd){for(let i=rg[k][0];i<=rg[k][1];i++)v+=fd[i];v/=(rg[k][1]-rg[k][0]+1)*255}T(x,bE[k],40+k*46,y,.5,8);bar(x,50+k*46,y+1,30,v)}
  y+=18;const prow=(k,v,f,col=C1)=>{T(x,k,12,y,.42,8.5);T(x,v,w-12,y,.85,8.5,col,'right');if(f!=null)bar(x,122,y+1,80,f,col);y+=14};
  const fr=m=>tot.byM0[m]?tot.byM[m]/tot.byM0[m]:0;
  prow('Aβ BURDEN',(fr('Aβ plaque')*100).toFixed(0)+'%',fr('Aβ plaque'),C2);prow('pTAU INDEX',(fr('pTau tangle')*3).toFixed(2),fr('pTau tangle'),C2);
  prow('SYNAPTIC DENS',(100-fr('synapse loss')*40).toFixed(0)+'%',1-fr('synapse loss')*.4);prow('NEUROINFLAM',(fr('microglial activation')*10).toFixed(1),fr('microglial activation'),C3);
  prow('MMSE (EST)',`${Math.round(14+(1-tot.burden)*15)}/30`,null);prow('REPAIRS',String(SP.repairs),null);
  T(x,'SIMULATION · SEA-AD-INSPIRED MODEL · NOT PATIENT DATA',w/2,h-8,.3,6.5,C1,'center')}

/* ===== clean screen ===== */
let clean=false,downAt=null;
function setClean(v){clean=v;document.body.classList.toggle('clean',v);const hn=$('cleanHint');hn.style.opacity=v?1:0;if(v)setTimeout(()=>{if(clean)hn.style.opacity=0},2200)}
$('bClean').onclick=()=>setClean(true);
renderer.domElement.addEventListener('pointerdown',e=>{downAt={x:e.clientX,y:e.clientY,t:performance.now()}});
renderer.domElement.addEventListener('pointerup',e=>{if(clean&&downAt&&Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)<5&&performance.now()-downAt.t<300)setClean(false);downAt=null});

/* ===== record: scene + overlays + frosted panes ===== */
let rec=null,chunks=[],rcv=null,rcx=null;
function compose(){const k=rcv.width/innerWidth;rcx.drawImage(renderer.domElement,0,0,rcv.width,rcv.height);if(clean)return;rcx.drawImage(hud,0,0,rcv.width,rcv.height);
  for(const[pid,P]of[['pObs',PO],['pTwin',PT],['pPat',PP]]){const el=$(pid);if(isMin(pid))continue;const r=el.getBoundingClientRect();
    rcx.save();rcx.beginPath();rcx.roundRect(r.left*k,r.top*k,r.width*k,r.height*k,12*k);rcx.clip();rcx.filter=`blur(${14*k}px)`;
    rcx.drawImage(renderer.domElement,r.left*k,r.top*k,r.width*k,r.height*k,r.left*k,r.top*k,r.width*k,r.height*k);rcx.filter='none';
    rcx.fillStyle='rgba(8,22,26,.35)';rcx.fillRect(r.left*k,r.top*k,r.width*k,r.height*k);rcx.strokeStyle='rgba(160,255,235,.18)';rcx.lineWidth=k;rcx.strokeRect(r.left*k,r.top*k,r.width*k,r.height*k);
    rcx.font=`${10*k}px ui-monospace,Menlo,monospace`;rcx.fillStyle='rgba(190,255,240,.82)';rcx.textAlign='left';rcx.fillText(el.querySelector('.ph').firstChild.textContent.trim(),(r.left+10)*k,(r.top+18)*k);
    const cr=P.c.getBoundingClientRect();rcx.drawImage(P.c,cr.left*k,cr.top*k,cr.width*k,cr.height*k);rcx.restore()}}
$('bRec').onclick=()=>{if(rec){rec.stop();return}if(!loaded){status('Upload a track first');return}ensureCtx();
  rcv=document.createElement('canvas');rcv.width=renderer.domElement.width;rcv.height=renderer.domElement.height;rcx=rcv.getContext('2d');
  const ms=new MediaStream([...rcv.captureStream(60).getVideoTracks(),...recDest.stream.getAudioTracks()]);
  const type=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  try{rec=new MediaRecorder(ms,type?{mimeType:type,videoBitsPerSecond:16e6}:{})}catch(e){status('Recording not supported here');return}
  chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{const mt=rec.mimeType||'video/webm',a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mt}));a.download='nanorepair.'+(mt.includes('mp4')?'mp4':'webm');a.click();
    rec=null;$('bRec').textContent='Record';$('bRec').classList.remove('rec')};
  rec.start(500);$('bRec').textContent='Stop rec';$('bRec').classList.add('rec');if(audio.paused)togglePlay()};

/* ===== diagnostics (hidden; D toggles) ===== */

setInterval(()=>{if(!showDbg)return;dbg.innerHTML=`fps ${fpsV} · ${fmt(audio.currentTime)}/${fmt(audio.duration)} · cluster ${SP.lobe+1}/${SEQ.length} · jumps ${SP.jumps} · steps ${SP.steps} · repairs ${SP.repairs} · kicks ${B.kicks} · pace ${SP.pace.toFixed(2)}`+(__errs.length?`<br><span style="color:#ff7a8a">${__errs.slice(-3).join('<br>')}</span>`:'')},400);
addEventListener('keydown',ev=>{if(clean){setClean(false);return}if(ev.target.tagName==='INPUT')return;if(ev.code==='Space'){ev.preventDefault();togglePlay()}else if(ev.key==='d'||ev.key==='D')$('bDiag').onclick();
  else if(ev.key==='c'||ev.key==='C')setClean(true);else if(ev.key==='z'||ev.key==='Z')$('bView').onclick();else if(ev.key==='ArrowLeft')seek(-10);else if(ev.key==='ArrowRight')seek(10)});

/* ===== loop ===== */
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
  U.uPx.value=renderer.getPixelRatio()*innerHeight/900;HD=Math.min(devicePixelRatio,2);HW=innerWidth;HH=innerHeight;hud.width=HW*HD;hud.height=HH*HD;PO.fit();PT.fit();PP.fit()}
addEventListener('resize',resize);resize();

camera.position.copy(SP.body).add(V(9,6,10));controls.target.copy(SP.body);
const clock=new THREE.Clock();let uiT=0;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),now=clock.elapsedTime;
  const ev=bands();U.uTime.value=now;U.uBass.value=B.bass;
  spiderUpdate(dt,now,ev);drawSpider(now);patTick(now,dt,ev);
  const kH=Math.exp(-dt*1.6);for(let i=0;i<NP;i++)if(HEAT[i]>.002)HEAT[i]*=kH;else HEAT[i]=0;heatA.needsUpdate=true;if(heatDirty){litA.needsUpdate=true;heatDirty=false;siteSync()}
  camUpdate(dt);bloom.strength=.55+B.bass*.3;
  composer.render();
  if(!clean){drawOverlay(now);if(!isMin('pObs'))drawObs(now);if(!isMin('pTwin'))drawTwin(now);if(!isMin('pPat'))drawPat(now)}
  if(rec&&rcx)compose();
  frames++;const t=performance.now();if(t-fpsT>1000){fpsV=Math.round(frames*1000/(t-fpsT));frames=0;fpsT=t}
  if((uiT+=dt)>.25){uiT=0;$('time').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration);if(!scrubbing&&audio.duration)scb.value=Math.round(audio.currentTime/audio.duration*1000)}}
loop();
